<section class="incident-list" aria-labelledby="incident-list-heading">
  <h2 id="incident-list-heading">Incidencias registradas</h2>

  @if (selectedIncidentId) {
    <p class="incident-list__selection" role="status">
      Incidencia seleccionada:
      <strong>{{ selectedIncidentId }}</strong>
    </p>
  }

  <div class="incident-list__content">
    @for (incident of incidents; track incident.id) {
      <app-incident-card
        [incident]="incident"
        (incidentSelected)="onIncidentSelected($event)"
        (deleteRequested)="onDeleteRequested($event)"
      />
    } @empty {
      <p class="incident-list__empty" role="status">
        No hay incidencias registradas.
      </p>
    }
  </div>
</section>
